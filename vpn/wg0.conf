# ============================================================
#  WireGuard VPN Configuration — ESP32-S3 Interface (wg0)
#  Board: LilyGo CC1101 Plus
#  Firmware: esp_nat_router (WireGuard-ESP32 embedded)
# ============================================================
#
#  IMPORTANT: Replace all <PLACEHOLDER> values with your real keys!
#  Generate keys with:
#    wg genkey | tee esp32_private.key | wg pubkey > esp32_public.key
# ============================================================

[Interface]
# ESP32-S3 WireGuard virtual IP address (inside the VPN tunnel)
Address = 10.0.0.1/24

# UDP port WireGuard listens on (must match firewall rule ACCEPT 51820)
ListenPort = 51820

# ESP32-S3 private key (keep this secret!)
# Generate: wg genkey
PrivateKey = <ESP32_PRIVATE_KEY_BASE64>

# DNS servers pushed to VPN clients
DNS = 1.1.1.1, 8.8.8.8

# MTU tuned for ESP32 Wi-Fi + WireGuard overhead
# Default WireGuard overhead: 60 bytes (IPv4) or 80 bytes (IPv6)
MTU = 1380

# ── PEER #1 — Mobile Phone / Laptop ──────────────────────────
[Peer]
# Human-readable name (comment only)
# Name: My Phone

# Peer's WireGuard public key
# Generate: wg genkey | wg pubkey
PublicKey = <PEER_1_PUBLIC_KEY_BASE64>

# Preshared key (optional but recommended for post-quantum security)
# Generate: wg genpsk
PresharedKey = <PRESHARED_KEY_BASE64>

# Which source IPs this peer is allowed to use inside the tunnel
# 10.0.0.2/32 = only this peer's VPN IP
AllowedIPs = 10.0.0.2/32

# Send keepalive every 25 seconds to maintain NAT mapping
PersistentKeepalive = 25

# ── PEER #2 — Upstream VPN Server (for full tunnel routing) ──
# Uncomment this block to route ALL traffic through a VPN server
# [Peer]
# # Name: VPN Exit Server
# PublicKey = <VPN_SERVER_PUBLIC_KEY_BASE64>
# PresharedKey = <PRESHARED_KEY_2_BASE64>
# # Route everything through this peer (0.0.0.0/0 = all traffic)
# AllowedIPs = 0.0.0.0/0, ::/0
# Endpoint = <VPN_SERVER_IP>:51820
# PersistentKeepalive = 25
