# ============================================================
#  ESP32-S3 NAT Router — Firewall Rules
#  Board: LilyGo CC1101 Plus (ESP32-S3)
#  Firmware: esp_nat_router
# ============================================================
#
# Rule format:
#   <direction> <protocol> <src_cidr> <dst_port> <action>
#
# Directions: INBOUND | OUTBOUND | FORWARD
# Protocols:  tcp | udp | icmp | all
# Action:     ACCEPT | DROP | REJECT | LOG
# ============================================================

# ── DEFAULT POLICIES ─────────────────────────────────────────
# Drop all inbound by default (whitelist approach)
DEFAULT INBOUND  DROP
DEFAULT OUTBOUND ACCEPT
DEFAULT FORWARD  ACCEPT

# ── LOOPBACK ─────────────────────────────────────────────────
INBOUND  all  127.0.0.0/8  *     ACCEPT   # Allow loopback

# ── ESTABLISHED / RELATED CONNECTIONS ────────────────────────
# Allow traffic that belongs to an already-established session
INBOUND  all  0.0.0.0/0   *     ACCEPT_ESTABLISHED

# ── LAN → WAN (OUTBOUND FROM AP CLIENTS) ─────────────────────
OUTBOUND all  192.168.4.0/24  *     ACCEPT   # LAN clients go out
OUTBOUND all  10.0.0.0/24    *     ACCEPT   # WireGuard subnet

# ── ICMP (PING) ───────────────────────────────────────────────
INBOUND  icmp  0.0.0.0/0   *     ACCEPT   # Allow ping/ICMP

# ── DNS ──────────────────────────────────────────────────────
INBOUND  udp  0.0.0.0/0   53    ACCEPT   # DNS queries (UDP)
INBOUND  tcp  0.0.0.0/0   53    ACCEPT   # DNS over TCP

# ── WEB MANAGEMENT UI ────────────────────────────────────────
# Only allow web UI from LAN (192.168.4.x)
INBOUND  tcp  192.168.4.0/24  80    ACCEPT   # HTTP management UI
INBOUND  tcp  0.0.0.0/0       80    DROP     # Block external HTTP

# ── WIREGUARD VPN ─────────────────────────────────────────────
INBOUND  udp  0.0.0.0/0   51820  ACCEPT   # WireGuard tunnel port

# ── BLOCK DANGEROUS SERVICES FROM WAN ────────────────────────
INBOUND  tcp  0.0.0.0/0   22    DROP     # Block SSH from WAN
INBOUND  tcp  0.0.0.0/0   23    DROP     # Block Telnet
INBOUND  tcp  0.0.0.0/0   21    DROP     # Block FTP
INBOUND  tcp  0.0.0.0/0   445   DROP     # Block SMB/NetBIOS
INBOUND  tcp  0.0.0.0/0   139   DROP     # Block NetBIOS
INBOUND  udp  0.0.0.0/0   137   DROP     # Block NetBIOS-NS
INBOUND  tcp  0.0.0.0/0   3389  DROP     # Block RDP
INBOUND  tcp  0.0.0.0/0   5900  DROP     # Block VNC
INBOUND  tcp  0.0.0.0/0   1433  DROP     # Block MSSQL
INBOUND  tcp  0.0.0.0/0   3306  DROP     # Block MySQL
INBOUND  tcp  0.0.0.0/0   6379  DROP     # Block Redis
INBOUND  tcp  0.0.0.0/0   27017 DROP     # Block MongoDB
INBOUND  udp  0.0.0.0/0   69    DROP     # Block TFTP
INBOUND  tcp  0.0.0.0/0   25    DROP     # Block SMTP (spam prevention)

# ── ANTI-SPOOFING ─────────────────────────────────────────────
# Drop packets claiming to come from private/reserved ranges on WAN
INBOUND  all  10.0.0.0/8      *     DROP   # Spoof: RFC1918
INBOUND  all  172.16.0.0/12   *     DROP   # Spoof: RFC1918
INBOUND  all  192.168.0.0/16  *     DROP   # Spoof: RFC1918 (non-LAN)
INBOUND  all  169.254.0.0/16  *     DROP   # Spoof: Link-local
INBOUND  all  224.0.0.0/4     *     DROP   # Spoof: Multicast

# ── RATE LIMITING (DoS protection) ───────────────────────────
# Limit new TCP connections to 20/sec per IP (syn flood protection)
INBOUND  tcp  0.0.0.0/0   *     RATE_LIMIT 20/s NEW_CONNECTIONS

# ── CATCH-ALL (Explicit final drop) ──────────────────────────
INBOUND  all  0.0.0.0/0   *     DROP     # Drop everything else
